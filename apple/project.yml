name: Monolith
options:
  # Bundle identifiers keep the original name: changing them makes a new app and leaves notes behind in the old one.
  bundleIdPrefix: com.socratic
  deploymentTarget:
    iOS: "26.1"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 422K9C2579 # kept here so `xcodegen generate` doesn't drop the team chosen in Xcode
# Open models run on the device through Apple's MLX. Pinned to releases at least two weeks old.
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 0.13.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.5
targets:
  Monolith:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - target: MonolithWatch
      - package: mlx-swift-lm
        products: [MLXLLM, MLXLMCommon, MLXHuggingFace]
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Monolith
        UILaunchScreen: {}
        UIApplicationSceneManifest: { UIApplicationSupportsMultipleScenes: true }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Monolith records audio so it can write a transcript for you.
        NSSpeechRecognitionUsageDescription: Recordings are transcribed on this device.
        NSCalendarsFullAccessUsageDescription: Your other calendars appear next to your events in Monolith. Nothing is changed in them.
        NSCameraUsageDescription: Scan the code on your computer to link it to this phone.
        NSFaceIDUsageDescription: Unlock Monolith when the lock is on, and after Sync mode.
        NSLocationWhenInUseUsageDescription: Integrations use where you are to give the assistant local context, like the weather and travel time to your next event. It stays on this iPhone.
        NSLocationAlwaysAndWhenInUseUsageDescription: With Location history on, Monolith notes the places you spend time so the assistant can refer to them. They stay on this iPhone, and you can clear them at any time.
        NSLocalNetworkUsageDescription: Sync with Monolith running on a computer on your network during development.
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        CFBundleURLTypes:
          - CFBundleURLName: com.socratic.app
            CFBundleURLSchemes: [monolith, socratic] # socratic: codes shown before the rename
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.socratic.app
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: iOS/Monolith.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  MonolithWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Monolith
        WKCompanionAppBundleIdentifier: com.socratic.app
        WKRunsIndependentlyOfCompanionApp: false
        WKApplication: true
        NSMicrophoneUsageDescription: Record from your wrist; it's transcribed on your iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.socratic.app.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
