# Every push and pull request: type-check, lint, the date parser cases, a production build (which also fails if any
# file is over Cloudflare Pages' 25 MiB limit), the startup bundle budget, and the end-to-end tests against that build
# in Chromium, accessibility checks (axe, WCAG 2.2 AA) included.
name: CI
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm run test:dates
      - run: npm run test:reuse
      - run: npx vite build
      - run: npm run budget
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
